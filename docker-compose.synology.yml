# ==============================================================================
# AdamRMS Clone - Synology DiskStation Docker Compose
# ==============================================================================
#
# Dieses Setup ist für Synology NAS optimiert und nutzt andere Ports als die
# Originalversion, damit beide parallel laufen können.
#
# Installation:
#   1. cp .env.synology.example .env.synology
#   2. nano .env.synology   (Werte anpassen!)
#   3. docker compose -f docker-compose.synology.yml --env-file .env.synology up -d
#
# Die App ist dann erreichbar unter:
#   http://<NAS-IP>:8090
#
# SSL/HTTPS:
#   Nutze den Synology Reverse Proxy (Systemsteuerung > Anmeldeportal > Erweitert
#   > Reverse Proxy) um eine Domain mit SSL auf Port 8090 weiterzuleiten.
#
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # Application (PHP + Apache)
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rmsclone-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:80"
    environment:
      - DB_HOSTNAME=db
      - DB_DATABASE=${DB_DATABASE:-rmsclone}
      - DB_USERNAME=${DB_USERNAME:-rmsclone}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=3306
      - DEV_MODE=false
      - ROOT_URL=${ROOT_URL:-http://localhost:8090}
      - CORS_ALLOWED_ORIGIN=${ROOT_URL:-http://localhost:8090}
      - CONFIG_ROOTURL=${ROOT_URL:-http://localhost:8090}
      - CONFIG_PROJECT_NAME=${CONFIG_PROJECT_NAME:-RMS Clone}
      - CONFIG_TIMEZONE=${CONFIG_TIMEZONE:-Europe/Berlin}
      - LOCAL_STORAGE_PATH=/var/www/html/storage
      - CONFIG_FILES_ENABLED=${CONFIG_FILES_ENABLED:-Enabled}
      - CONFIG_EMAILS_ENABLED=${CONFIG_EMAILS_ENABLED:-Disabled}
      - CONFIG_EMAILS_PROVIDER=${CONFIG_EMAILS_PROVIDER:-SMTP}
      - CONFIG_EMAILS_FROMEMAIL=${CONFIG_EMAILS_FROMEMAIL:-}
      - CONFIG_EMAILS_SMTP_SERVER=${CONFIG_EMAILS_SMTP_SERVER:-}
      - CONFIG_EMAILS_SMTP_PORT=${CONFIG_EMAILS_SMTP_PORT:-587}
      - CONFIG_AUTH_JWTKey=${CONFIG_AUTH_JWTKey}
      - CONFIG_TELEMETRY_NANOID=${CONFIG_TELEMETRY_NANOID:-synology}
    volumes:
      - rmsclone_storage:/var/www/html/storage
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/api/health.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # --------------------------------------------------------------------------
  # MySQL Database (eigener Port, kein Konflikt mit Original-RMS)
  # --------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: rmsclone-db
    restart: always
    command: >-
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --innodb-flush-log-at-trx-commit=2
      --max-connections=50
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - rmsclone_db:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-rmsclone}
      - MYSQL_USER=${DB_USERNAME:-rmsclone}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rmsclone_db:
    driver: local
  rmsclone_storage:
    driver: local
