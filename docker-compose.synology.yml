# ==============================================================================
# MyRMS - Synology DiskStation Docker Compose
# ==============================================================================
#
# Dieses Setup ist fuer Synology NAS optimiert und ersetzt die Originalversion.
#
# Installation:
#   1. cp .env.synology.example .env.synology
#   2. nano .env.synology   (Werte anpassen!)
#   3. docker compose -f docker-compose.synology.yml --env-file .env.synology up -d
#
# Die App ist dann erreichbar unter:
#   http://<NAS-IP>:80
#
# SSL/HTTPS:
#   Nutze den Synology Reverse Proxy (Systemsteuerung > Anmeldeportal > Erweitert
#   > Reverse Proxy) um eine Domain mit SSL weiterzuleiten.
#
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # Application (PHP + Apache)
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myrms-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      - DB_HOSTNAME=db
      - DB_DATABASE=${DB_DATABASE:-myrms}
      - DB_USERNAME=${DB_USERNAME:-myrms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=3306
      - DEV_MODE=false
      - ROOT_URL=${ROOT_URL:-http://localhost}
      - CORS_ALLOWED_ORIGIN=${ROOT_URL:-http://localhost}
      - CONFIG_ROOTURL=${ROOT_URL:-http://localhost}
      - CONFIG_PROJECT_NAME=${CONFIG_PROJECT_NAME:-MyRMS}
      - CONFIG_TIMEZONE=${CONFIG_TIMEZONE:-Europe/Berlin}
      - LOCAL_STORAGE_PATH=/var/www/html/storage
      - CONFIG_FILES_ENABLED=${CONFIG_FILES_ENABLED:-Enabled}
      - CONFIG_EMAILS_ENABLED=${CONFIG_EMAILS_ENABLED:-Disabled}
      - CONFIG_EMAILS_PROVIDER=${CONFIG_EMAILS_PROVIDER:-SMTP}
      - CONFIG_EMAILS_FROMEMAIL=${CONFIG_EMAILS_FROMEMAIL:-}
      - CONFIG_EMAILS_SMTP_SERVER=${CONFIG_EMAILS_SMTP_SERVER:-}
      - CONFIG_EMAILS_SMTP_PORT=${CONFIG_EMAILS_SMTP_PORT:-587}
      - CONFIG_AUTH_JWTKey=${CONFIG_AUTH_JWTKey}
      - CONFIG_TELEMETRY_NANOID=${CONFIG_TELEMETRY_NANOID:-synology}
    volumes:
      - myrms_storage:/var/www/html/storage
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/api/health.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # --------------------------------------------------------------------------
  # MySQL Database
  # --------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: myrms-db
    restart: always
    command: >-
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --innodb-flush-log-at-trx-commit=2
      --max-connections=50
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    volumes:
      - myrms_db:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-myrms}
      - MYSQL_USER=${DB_USERNAME:-myrms}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  myrms_db:
    driver: local
  myrms_storage:
    driver: local
