# ==============================================================================
# Nginx - Internal Reverse Proxy für Cloudflare Tunnel
# ==============================================================================
# Kein SSL nötig - Cloudflare übernimmt die SSL-Terminierung.
# Dieser Nginx ist nur intern im Docker-Netzwerk erreichbar.
# Cloudflared verbindet sich zu nginx:80 und leitet Traffic weiter.
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cloudflare stellt den echten Client-IP über CF-Connecting-IP bereit
    # Trust Cloudflare IPs (der Traffic kommt über den Tunnel)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header CF-Connecting-IP;

    # Client body size (für Datei-Uploads)
    client_max_body_size 64m;

    # Proxy zum PHP-Apache App-Container
    location / {
        proxy_pass http://app:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }

    # Health-check Endpoint
    location = /api/health.php {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }
}
