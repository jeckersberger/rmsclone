version: "2.4"

# ==============================================================================
# MyRMS - Synology NAS + Cloudflare Tunnel
# ==============================================================================
# Fuer Synology DS918+ mit Docker Compose v1
# Alle Werte sind direkt eingetragen (kein --env-file noetig)
#
# Start:   sudo docker-compose -f docker-compose.synology-cloudflare.yml up -d
# Stop:    sudo docker-compose -f docker-compose.synology-cloudflare.yml down
# Logs:    sudo docker-compose -f docker-compose.synology-cloudflare.yml logs -f
# Status:  sudo docker-compose -f docker-compose.synology-cloudflare.yml ps
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # Application (PHP + Apache)
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile.synology
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOSTNAME=db
      - DB_DATABASE=myrms
      - DB_USERNAME=myrms
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=3306
      - DEV_MODE=false
      - ROOT_URL=https://dash.je-soundulight
      - CORS_ALLOWED_ORIGIN=https://dash.je-soundulight
      - CONFIG_ROOTURL=https://dash.je-soundulight
      - CONFIG_PROJECT_NAME=MyRMS
      - CONFIG_TIMEZONE=Europe/Berlin
      - LOCAL_STORAGE_PATH=/var/www/html/storage
      - CONFIG_FILES_ENABLED=Enabled
      - CONFIG_EMAILS_ENABLED=Enabled
      - CONFIG_EMAILS_PROVIDER=SMTP
      - CONFIG_EMAILS_FROMEMAIL=noreply@je-soundulight
      - CONFIG_EMAILS_SMTP_SERVER=smtp.example.com
      - CONFIG_EMAILS_SMTP_PORT=587
      - CONFIG_AUTH_JWTKey=${JWT_KEY}
      - CONFIG_TELEMETRY_NANOID=cloudflare_prod
    volumes:
      - file_storage:/var/www/html/storage
    mem_limit: 512m

  # --------------------------------------------------------------------------
  # MySQL Database
  # --------------------------------------------------------------------------
  db:
    image: mysql:8.0
    restart: always
    command: >-
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --innodb-flush-log-at-trx-commit=2
      --max-connections=150
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=myrms
      - MYSQL_USER=myrms
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # Nginx - Interner Reverse Proxy
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    restart: always
    volumes:
      - ./docker/nginx/nginx-cloudflare.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    mem_limit: 128m

  # --------------------------------------------------------------------------
  # Cloudflare Tunnel
  # --------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - nginx
    mem_limit: 128m

volumes:
  db_data:
    driver: local
  file_storage:
    driver: local
