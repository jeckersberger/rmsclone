# ==============================================================================
# AdamRMS - Production Docker Compose
# ==============================================================================
#
# Usage:
#   cp .env.prod.example .env.prod
#   # Edit .env.prod with your real values
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# First-time SSL setup:
#   1. Comment out the port-443 server block in docker/nginx/nginx.conf
#   2. Start the stack so certbot can complete the HTTP-01 challenge
#   3. Run:  docker compose -f docker-compose.prod.yml exec certbot \
#            certbot certonly --webroot -w /var/www/certbot \
#            -d $APP_DOMAIN --email $LETSENCRYPT_EMAIL --agree-tos
#   4. Uncomment the 443 block, then:  docker compose -f docker-compose.prod.yml restart nginx
#
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # Application (PHP + Apache)
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOSTNAME=${DB_HOSTNAME:-db}
      - DB_DATABASE=${DB_DATABASE:-adamrms}
      - DB_USERNAME=${DB_USERNAME:-adamrms}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT:-3306}
      - DEV_MODE=false
      - ROOT_URL=${ROOT_URL}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN}
      - CONFIG_ROOTURL=${ROOT_URL}
      - CONFIG_PROJECT_NAME=${CONFIG_PROJECT_NAME:-AdamRMS}
      - CONFIG_TIMEZONE=${CONFIG_TIMEZONE:-Europe/Berlin}
      - LOCAL_STORAGE_PATH=${LOCAL_STORAGE_PATH:-/var/www/html/storage}
      - CONFIG_FILES_ENABLED=${CONFIG_FILES_ENABLED:-Enabled}
      - CONFIG_EMAILS_ENABLED=${CONFIG_EMAILS_ENABLED:-Enabled}
      - CONFIG_EMAILS_PROVIDER=${CONFIG_EMAILS_PROVIDER:-SMTP}
      - CONFIG_EMAILS_FROMEMAIL=${CONFIG_EMAILS_FROMEMAIL}
      - CONFIG_EMAILS_SMTP_SERVER=${CONFIG_EMAILS_SMTP_SERVER}
      - CONFIG_EMAILS_SMTP_PORT=${CONFIG_EMAILS_SMTP_PORT:-587}
      - CONFIG_AUTH_JWTKey=${CONFIG_AUTH_JWTKey}
      - CONFIG_TELEMETRY_NANOID=${CONFIG_TELEMETRY_NANOID:-prod}
    volumes:
      - file_storage:/var/www/html/storage
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/api/health.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --------------------------------------------------------------------------
  # MySQL Database
  # --------------------------------------------------------------------------
  db:
    image: mysql:8.0
    restart: always
    command: >-
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --max-connections=150
      --sort-buffer-size=2M
      --join-buffer-size=2M
      --tmp-table-size=64M
      --max-heap-table-size=64M
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=2
    volumes:
      - db_data:/var/lib/mysql
      - db_logs:/var/log/mysql
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-adamrms}
      - MYSQL_USER=${DB_USERNAME:-adamrms}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # Nginx Reverse Proxy with SSL
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # --------------------------------------------------------------------------
  # Certbot - SSL certificate management (Let's Encrypt)
  # --------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    restart: "no"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Dry-run by default; override entrypoint for real certificate requests
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"

  # --------------------------------------------------------------------------
  # Automatic SSL renewal (runs certbot renew every 12 hours)
  # --------------------------------------------------------------------------
  # The certbot service above already handles renewal in its entrypoint loop.
  # Nginx needs a reload after renewal to pick up new certs:
  nginx-reload:
    image: docker:cli
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: "/bin/sh -c 'while true; do sleep 12h; docker kill --signal=HUP $$(docker ps -q --filter name=nginx) 2>/dev/null; done'"
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M

volumes:
  db_data:
    driver: local
  db_logs:
    driver: local
  file_storage:
    driver: local
  certbot_www:
    driver: local
  certbot_certs:
    driver: local
